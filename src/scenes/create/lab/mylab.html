<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;background:#111}</style></head><body>
<script type="module">
import { renderPortraitWith, portraitStats } from '/src/ui/components/portraitGL.js';
import { offscreen } from '/src/ui/components/Miniature.js';
window.__run = async (chars, o = {}) => {
  const off = offscreen();
  const scale = o.scale ?? 0.6;
  const cols = o.cols ?? 4;
  const W = Math.round(300 * scale), H = Math.round(375 * scale);
  const rows = Math.ceil(chars.length / cols);
  const out = document.createElement('canvas');
  out.width = W * cols; out.height = H * rows;
  const g = out.getContext('2d');
  const t0 = performance.now();
  chars.forEach((ch, i) => {
    const c = renderPortraitWith(off.renderer, ch, { scale, crop: o.crop ?? 'head', oil: o.oil, mode: o.mode, yaw: (o.yaws||[])[i], lightK: (o.lks||[])[i], dbg: (o.dbgs||[])[i], key: (o.keys||[])[i] });
    g.drawImage(c, (i % cols) * W, Math.floor(i / cols) * H, W, H);
  });
  return { url: out.toDataURL('image/png'), ms: performance.now() - t0 };
};
window.__READY = true;
</script></body></html>
